# Stack pack: nextjs-fastapi. `files/` is copied into a product repo at step 6; `example/` is copied over
# it only by Pavedline's own starter check, never into a product.
name: nextjs-fastapi
description: Monorepo with a FastAPI service on PostgreSQL (row-level-security tenancy), more surfaces added alongside.

surfaces:
  api:
    description: FastAPI service (uv project, Alembic, tenant-scoped transactions, Idempotency-Key)
    paths:
      - services/api
      - scripts/rls_check.py
      - scripts/contract_check.py
      - scripts/events_check.py
      - docs/observability/EVENTS.md
      - scripts/local_secrets.sh
      - scripts/restore_drill.sh
      - .env.local.example
    # Each folder is a Helm chart (an Argo CD Application, see the gitops skill). postgres is shared: it is copied
    # whenever this surface is chosen, because the API needs a database.
    infra:
      - infra/k8s/apps/api
      - infra/k8s/apps/postgres
    ci_markers:
      - "# pavedline-surface: api"
    commands:
      # run from services/api
      install: uv sync --frozen
      lint: uv run ruff check . ../../scripts
      format_check: uv run ruff format --check . ../../scripts
      types: uv run pyright
      imports: uv run lint-imports
      events: python3 ../../scripts/events_check.py --root ../..   # EVENTS.md lists every emitted event
      test: uv run pytest -q          # needs DATABASE_URL: an administrator URL of a THROWAWAY Postgres
      # run from the repository root, against the migrated database and the product's contract
      rls_check: uv run --project services/api python scripts/rls_check.py --database-url "$DATABASE_OWNER_URL"
      contract_check: uv run --project services/api python scripts/contract_check.py --app app.main:app --contract docs/api/openapi.yaml
      image: docker build -t api:dev services/api

  web:
    description: "Next.js web app (App Router, standalone server). Frontend only, so it calls the API from the server and has no backend of its own."
    paths:
      - apps/web
      - packages/api-client
      - packages/tokens
      - packages/glossary
      - scripts/web_boundary_check.py
    infra:
      - infra/k8s/apps/web
    ci_markers:
      - "# pavedline-surface: web"
    commands:
      # run from the repository root (pnpm 11.28.8: `npx --yes pnpm@11.28.8 ...` when pnpm is not installed)
      install: pnpm install --frozen-lockfile
      lint: pnpm -r lint              # biome ci . in every workspace
      types: pnpm -r typecheck        # tsc --noEmit
      test: pnpm -r test              # vitest run
      generated: pnpm run check:generated   # the API client and the tokens are current
      boundary: python3 scripts/web_boundary_check.py
      build: pnpm --filter @app/web build
      e2e: pnpm --filter @app/web e2e # Playwright + axe on the standalone build; needs `pnpm --filter @app/web exec playwright install chromium`
      image: docker build -f apps/web/Dockerfile -t web:dev .   # context: the repository root; the boot check runs in the build

  site:
    description: Next.js website with an MDX blog, deployed separately from the web app (caches and releases on its own). Frontend only.
    paths:
      - apps/site
      - packages/tokens
      - scripts/web_boundary_check.py
    infra:
      - infra/k8s/apps/site
    ci_markers:
      - "# pavedline-surface: site"
    commands:
      install: pnpm install --frozen-lockfile
      lint: pnpm -r lint
      types: pnpm -r typecheck
      test: pnpm -r test
      boundary: python3 scripts/web_boundary_check.py
      build: pnpm --filter @app/site build
      image: docker build -f apps/site/Dockerfile -t site:dev .

  mobile:
    description: Expo (React Native) app. One screen reads the API's /healthz; below the API's minimum supported app version it shows a blocking update screen. Native projects are generated by `expo prebuild` and never committed.
    paths:
      - apps/mobile
    # No Helm chart: mobile is not deployed to Kubernetes. It ships through the stores (a founder step, see the mobile-build skill).
    ci_markers:
      - "# pavedline-surface: mobile"
    commands:
      # run from the repository root (pnpm 11.28.8: `npx --yes pnpm@11.28.8 ...` when pnpm is not installed)
      install: pnpm install --frozen-lockfile
      lint: pnpm --filter @app/mobile lint          # eslint with the react-native-a11y rule set (accessibility gate)
      types: pnpm --filter @app/mobile typecheck    # tsc --noEmit
      test: pnpm --filter @app/mobile test          # jest (jest-expo) + @testing-library/react-native
      prebuild: pnpm --filter @app/mobile exec expo prebuild --no-install --platform android   # generates apps/mobile/android (not committed)
      # CI-only: they need the Android SDK + JDK 17 (ubuntu-24.04 runner) and Xcode + CocoaPods (macos-26 runner)
      android_build: cd apps/mobile/android && ./gradlew assembleDebug   # after `expo prebuild --platform android`; CI-only (Linux)
      ios_build: cd apps/mobile && npx expo prebuild --platform ios && xcodebuild -workspace ios/Example.xcworkspace -scheme Example -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build   # unsigned simulator build; CI-only (macOS)

# Files every JavaScript surface needs. They are copied when web or site is chosen (and when mobile is added, which
# shares the workspace). One workspace, one lockfile: pnpm-lock.yaml is committed and `--frozen-lockfile` is the install.
shared:
  needed_by: [web, site, mobile]
  paths:
    - package.json
    - pnpm-workspace.yaml
    - pnpm-lock.yaml
    - biome.json
    - tsconfig.base.json
    - .node-version
    - .npmrc
    - .dockerignore
    - RUN.stack.md

# Files every product gets, whatever surfaces it has (the deploy loop). infra/local-deploy.json lists one entry per app
# with its surface: copy only the entries of the chosen surfaces (the postgres entry goes with the api surface).
deploy:
  paths:
    - scripts/deploy_local.sh
    - scripts/release_check.py
    - scripts/promote.py
    - scripts/post_deploy_check.py
    - infra/local-deploy.json

# The PostgreSQL majors this pack pins (CloudNativePG images, multi-arch index digests). step 6 passes the product's
# database decision to `apply_stack.py --postgres-major N`, which writes that image into infra/k8s/apps/postgres/values.yaml;
# `cluster` is the CloudNativePG image, `test` the official image of the API test database in .github/workflows/ci-api.yml;
# a major not listed here is refused. Facts and dates: skills/fastapi-service/references/sources.md.
postgres:
  default_major: 16
  majors:
    16:
      cluster: ghcr.io/cloudnative-pg/postgresql:16.15-202610190958-standard-trixie@sha256:f105e137d731f6ac4f69667383f2373345ce8b72dadcc10ab6d385a7a32d6e7f
      test: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    18:
      cluster: ghcr.io/cloudnative-pg/postgresql:18.6-202610190957-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
      test: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636

# Copied with any surface. A product that already has these files keeps its own (apply_stack prints `kept: <path>`).
common:
  keep_if_present: true
  paths:
    - .gitignore

# The text appended to the product's RUN.md under "## Stack: <pack>". It is not copied as a file.
run_fragment: RUN.stack.md

# Surface-aware text: between `pavedline-begin: <surface>[, <surface>]` and `pavedline-end` marker lines (any comment
# syntax) the block is kept only when one of the listed surfaces is chosen; apply_stack always removes the marker lines.

# Skills the stack enables. Local skills ship in this plugin; the others are installed with the skills CLI:
#   npx skills add <source> --skill <name>
# Vercel's deploy-to-vercel skills are deliberately NOT listed: deploys go through GitOps (Argo CD), never a vendor CLI.
# Names checked on GitHub 2026-11-09 (see SOURCES.md).
skills:
  - fastapi-service
  - mobile-build
  - {name: next-dev-loop, source: vercel/next.js, path: skills/next-dev-loop}
  - {name: next-bundle-optimizer, source: vercel/next.js, path: skills/next-bundle-optimizer}
  - {name: next-cache-components-adoption, source: vercel/next.js, path: skills/next-cache-components-adoption}
  - {name: next-cache-components-optimizer, source: vercel/next.js, path: skills/next-cache-components-optimizer}
  - {name: next-partial-prefetching-adoption, source: vercel/next.js, path: skills/next-partial-prefetching-adoption}
  - {name: next-partial-prefetching-optimizer, source: vercel/next.js, path: skills/next-partial-prefetching-optimizer}
  - {name: react-best-practices, source: vercel-labs/agent-skills, path: skills/react-best-practices}
  - {name: composition-patterns, source: vercel-labs/agent-skills, path: skills/composition-patterns}
  - {name: web-design-guidelines, source: vercel-labs/agent-skills, path: skills/web-design-guidelines}
  - {name: react-view-transitions, source: vercel-labs/agent-skills, path: skills/react-view-transitions}
  - {name: react-native-skills, source: vercel-labs/agent-skills, path: skills/react-native-skills}

tools:
  - uv
  - node
  - pnpm
  - docker
