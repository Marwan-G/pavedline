name: security

# Surface-agnostic scanners. Nothing here names a surface: Checkov walks every chart folder that exists under
# infra/k8s/apps/, and the web boundary check runs only when the web or site surface is present.
# - Semgrep (first-party code) and Trivy (known vulnerabilities in dependency files) fail the build.
# - Checkov scans the RENDERED Helm output (what Argo CD would apply) of every chart for staging and production.
# A weekly run catches new advisories on code that did not change.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Official image (semgrep.dev/docs), by digest; v1.182.0 of 2026-10-20.
      SEMGREP_IMAGE: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (registry ruleset p/default, no telemetry, any finding fails)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --metrics=off --error --exclude node_modules --exclude .venv

  trivy-fs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Official image, by digest (Trivy's GitHub Action wrappers are not used: see docs/architecture/STACK-SOURCES.md).
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy filesystem scan (lockfiles; fail on HIGH or CRITICAL that have a fix)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --no-progress /src

  checkov:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Official image, by digest (built 2026-10-20, at least 14 days old); the pip package floats its dependencies.
      CHECKOV_IMAGE: bridgecrew/checkov:3.3.30@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm v4.3.1 (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 20 --retry-all-errors -O https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          # Expected sha256 from https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  helm-v4.3.1-linux-amd64.tar.gz" | sha256sum --check --strict
          tar -xzf helm-v4.3.1-linux-amd64.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
      - name: Render every chart for staging and production, then scan the output
        run: |
          shopt -s nullglob
          out="$RUNNER_TEMP/rendered"
          mkdir -p "$out"
          charts=(infra/k8s/apps/*/)
          if [ "${#charts[@]}" -eq 0 ]; then
            echo "no charts under infra/k8s/apps/; skipping"
            exit 0
          fi
          for chart in "${charts[@]}"; do
            name=$(basename "$chart")
            helm dependency update "$chart"
            helm lint "$chart" -f "$chart/values-staging.yaml"
            for env in staging production; do
              values="$chart/values-$env.yaml"
              [ -f "$values" ] || values="$chart/values.yaml"
              helm template "$name" "$chart" -f "$values" --namespace "$name" > "$out/$name-$env.yaml"
            done
          done
          docker run --rm -v "$out:/rendered:ro" -v "$PWD/infra/helm/.checkov.yaml:/config/checkov.yaml:ro" "$CHECKOV_IMAGE" \
            -d /rendered --framework kubernetes --config-file /config/checkov.yaml --compact --quiet

  web-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Web boundary check (frontend apps hold no backend)
        run: |
          if [ -f scripts/web_boundary_check.py ]; then
            python3 scripts/web_boundary_check.py
          else
            echo "no web or site surface; skipping"
          fi
