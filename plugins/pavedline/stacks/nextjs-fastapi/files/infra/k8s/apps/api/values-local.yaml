# Local (kind): the image comes from the local registry; step 10 / the deploy script sets a unique tag every deploy.
# APP_ENV=development, so the API starts without the AUTH_* keys (every /v1 route then answers 401); put them in the
# gitignored .env.local and re-run scripts/local_secrets.sh to test tokens.
workloads:
  api:
    image:
      repository: localhost:5001/api
      tag: "local-0001"
    replicas: 1
    # api-auth (see values.yaml) plus api-webhooks: only the two webhook signing secrets from .env.local, written by
    # scripts/local_secrets.sh (empty = no webhook route exists). Optional, so a cluster made before this Secret
    # existed still starts. Staging and production add theirs from the vault.
    envFromSecrets:
      - api-auth
      - name: api-webhooks
        optional: true
    env:
      APP_ENV: development
    route:
      hostnames: ["api.localtest.me"]   # *.localtest.me resolves to 127.0.0.1 (checked 2026-11-09); host port 8080 is the Gateway
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
