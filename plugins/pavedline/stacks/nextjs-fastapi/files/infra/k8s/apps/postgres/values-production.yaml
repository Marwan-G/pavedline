# step 12 adds backups (Barman Cloud to S3-compatible storage), the restore drill and the sizing from real load.
cluster:
  instances: 3
  storage:
    size: 20Gi
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
pooler:
  instances: 2
