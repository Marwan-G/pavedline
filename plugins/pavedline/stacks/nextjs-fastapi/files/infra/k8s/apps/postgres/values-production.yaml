# Production: three instances, anti-affinity, quorum synchronous replication; backups ship OFF until step 12.
# The endpoint and bucket below are PLACEHOLDERS. Step 12 (go to production) fills in the real ones with the founder,
# creates the db-backup-s3 Secret and sets enabled: true; the chart refuses to render enabled backups that still point
# at a placeholder, so a sync can never start an archiver that cannot upload.
cluster:
  instances: 3
  storage:
    size: 20Gi
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
pooler:
  instances: 2
backup:
  enabled: false
  objectStore:
    destinationPath: s3://example-production-backups/db
    endpointURL: https://s3.example.com
