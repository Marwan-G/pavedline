{{- $c := .Values.cluster -}}
# CloudNativePG Cluster. With backup.enabled it archives WAL and takes base backups through the Barman Cloud plugin
# (ObjectStore + ScheduledBackup in this chart); scripts/restore_drill.sh proves a backup restores. Load-based sizing
# is step 12's work.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $c.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  instances: {{ $c.instances }}
  imageName: {{ .Values.image }}
  priorityClassName: {{ $c.priorityClassName }}
  storage:
    size: {{ $c.storage.size }}
  resources:
    {{- toYaml $c.resources | nindent 4 }}
  {{- if or (gt (int $c.instances) 1) $c.nodeSelector $c.tolerations }}
  affinity:
    {{- if gt (int $c.instances) 1 }}
    enablePodAntiAffinity: true
    podAntiAffinityType: {{ $c.antiAffinity }}
    {{- end }}
    {{- with $c.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $c.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if gt (int $c.instances) 1 }}
  postgresql:
    synchronous:
      method: any
      number: 1
  {{- end }}
  {{- if .Values.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.backup.objectStore.name }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ $c.database }}
      owner: app_owner
      secret:
        name: {{ .Values.secrets.owner }}
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: db-roles-sql
            key: roles.sql
  # The three roles of spec 12.3. Attributes mirror services/api/db/roles.sql; passwords come from the Secrets.
  # Only app_owner may bypass row-level security. app_runtime owns nothing and is not a member of app_owner.
  managed:
    roles:
      - name: app_owner
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: true
        passwordSecret:
          name: {{ .Values.secrets.owner }}
      - name: app_runtime
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: {{ .Values.secrets.runtime }}
      - name: app_admin
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        bypassrls: false
        passwordSecret:
          name: {{ .Values.secrets.admin }}
