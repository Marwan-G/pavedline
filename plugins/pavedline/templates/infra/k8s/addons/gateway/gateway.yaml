# The shared Gateway: GatewayClass `envoy` (Envoy Gateway), Gateway `shared` in namespace `gateway` with one HTTP
# listener `http`. TLS ends at the edge (Cloudflare) in production. A namespace may attach HTTPRoutes only when it
# carries the label gateway-access=shared (the apps ApplicationSet puts it on every app namespace it creates).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: shared
    namespace: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: shared
