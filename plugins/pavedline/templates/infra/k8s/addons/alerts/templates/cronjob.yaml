{{- if .Values.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: alerts-check
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alerts
spec:
  schedule: {{ required "schedule is required" .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app.kubernetes.io/name: alerts
        spec:
          serviceAccountName: alerts
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: checker
              image: {{ .Values.image }}
              command: [python3, -I, /app/checker.py]
              env:
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
                # Both come from the Secret; a missing Secret or key stops the pod before it starts, loudly.
                - name: NOTIFY_URL
                  valueFrom: {secretKeyRef: {name: {{ required "secretName is required" .Values.secretName }}, key: NOTIFY_URL}}
                - name: HEARTBEAT_URL
                  valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: HEARTBEAT_URL}}
                - {name: ALERTS_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
{{ toYaml .Values.resources | indent 16 }}
              volumeMounts:
                - {name: app, mountPath: /app, readOnly: true}
          volumes:
            - name: app
              configMap:
                name: alerts-config
                items:
                  - {key: checker.py, path: checker.py}
                  - {key: config.json, path: config.json}
{{- end }}
