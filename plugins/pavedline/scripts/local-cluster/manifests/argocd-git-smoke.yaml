# verify.sh: an Argo CD Application that syncs a ConfigMap from the local git server over git://.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: git-smoke
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://kind-git:9418/@PROJECT@.git
    targetRevision: main
    path: smoke
  destination:
    server: https://kubernetes.default.svc
    namespace: git-smoke
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
