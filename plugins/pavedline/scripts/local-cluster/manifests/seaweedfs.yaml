# up.sh --full: the local S3-compatible store for database backups (SeaweedFS, one pod, data on an emptyDir: it lives
# and dies with the cluster). Reachable only inside the cluster at http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333.
# The access key is a throwaway generated by up.sh into Secret seaweedfs-s3 (s3.json is SeaweedFS's identity file); the
# bucket is created on the first upload by the admin identity (-s3.autoCreateBucket, the default).
apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: "@SEAWEEDFS_IMAGE@"
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=128
            - -volume.max=30
            - -filer
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - containerPort: 8333
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: s3
          secret:
            secretName: seaweedfs-s3
            items:
              - {key: s3.json, path: s3.json}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: seaweedfs
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
