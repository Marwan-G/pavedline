# tunnel.sh: the ONLY route a quick tunnel can reach. The tunnel sends Host: tunnel.localtest.me, which no other route
# matches, so /v1, /openapi.json, Mailpit, the SMS sink and every other host stay unreachable from the internet.
# @BACKEND@ is the API's Service in namespace api (found by tunnel.sh).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pavedline-tunnel
  namespace: api
spec:
  parentRefs:
    - {name: shared, namespace: gateway, sectionName: http}
  hostnames: ["tunnel.localtest.me"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /webhooks/}
        - path: {type: Exact, value: /healthz}
      backendRefs:
        - {name: "@BACKEND@", port: 80}
